<style>
/* Layout: one-screen cinema curtain; a ticket stub card in the middle, a big red "Pick" button anchored at the thumb zone. Single deliberate red look. */
:root{
  --curtain:#5c0a12;      /* deep velvet */
  --curtain-dark:#2a0307; /* shadow folds */
  --red:#e3122b;          /* marquee red */
  --red-hot:#ff3b4e;
  --paper:#fbefe6;        /* ticket stock */
  --ink:#2b0a0e;
  --ink-soft:#7a3a40;
  --gold:#f2c14e;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Figtree", -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--body);color:var(--paper);
  background:var(--curtain-dark);
  background-image:
    repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 2px, transparent 2px 38px, rgba(255,255,255,.035) 38px 40px, transparent 40px 76px),
    radial-gradient(120% 70% at 50% 0%, #9b1220 0%, var(--curtain) 45%, var(--curtain-dark) 100%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
}
.app{
  min-height:100%;max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;gap:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:14px 18px;
}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;line-height:1}
.brand small{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);opacity:.9}
.brand h1{margin:4px 0 0;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.01em}
.brand h1 span{color:var(--red-hot)}
.count{font-family:var(--mono);font-size:11px;text-align:right;color:rgba(251,239,230,.7);line-height:1.5}
.count b{color:var(--paper);font-weight:500}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;border:1px solid rgba(251,239,230,.28);background:rgba(0,0,0,.18);color:var(--paper);
  font:600 13px var(--body);padding:8px 14px;border-radius:999px;cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--paper);color:var(--curtain);border-color:var(--paper)}
.chip:focus-visible,.btn:focus-visible,.pick:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.seg{display:grid;grid-template-columns:.7fr 1fr 1fr;background:rgba(0,0,0,.28);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;color:rgba(251,239,230,.75);font:700 13px var(--body);padding:9px 6px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.effort{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:13px;line-height:1.35}
.effort b{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.effort.easy{background:#e9f3ea;color:#24502c}
.effort.brain{background:var(--ink);color:var(--paper)}
.effort.brain b{color:var(--gold)}

/* Ticket */
.stage{flex:1;display:flex;align-items:center;justify-content:center;perspective:1200px;min-height:0}
.ticket{
  width:100%;background:var(--paper);color:var(--ink);border-radius:14px;position:relative;
  box-shadow:0 24px 50px -18px rgba(0,0,0,.65), 0 2px 0 rgba(255,255,255,.4) inset;
  transform-origin:50% 0%;
}
.ticket.deal{animation:deal .55s cubic-bezier(.2,.9,.25,1.15)}
@keyframes deal{from{transform:translateY(-26px) rotateX(38deg);opacity:.2}to{transform:none;opacity:1}}
.stub{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:12px 18px;background:var(--red);color:#fff;border-radius:14px 14px 0 0;
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
}
.stub .no{opacity:.85}
.perf{height:0;border-top:2px dashed rgba(43,10,14,.22);margin:0 14px;position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--curtain)}
.perf::before{left:-25px}.perf::after{right:-25px}
.main{padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.title{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(26px,7.6vw,34px);line-height:1.05;letter-spacing:-.015em;text-wrap:balance;overflow-wrap:anywhere}
.aka{margin:-6px 0 0;font-size:14px;color:var(--ink-soft);font-style:italic}
.meta{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.meta div{padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.meta div+div{border-left:1.5px solid var(--ink)}
.meta dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.meta dd{margin:0;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.meta .rating dd{color:var(--red)}
.meta .rating dd small{font-size:12px;color:var(--ink-soft);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(227,18,43,.1);color:#a50d20}
.tag.country{background:transparent;border:1px solid rgba(43,10,14,.25);color:var(--ink-soft)}
.summary{margin:0;font-size:15.5px;line-height:1.55;color:#3d1418}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font:700 13px var(--body);padding:10px 12px;border-radius:10px;cursor:pointer;text-decoration:none;
  border:1.5px solid var(--ink);background:transparent;color:var(--ink);
}
.btn.on{background:var(--ink);color:var(--paper)}

.empty{padding:30px 22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty .big{font-family:var(--display);font-size:30px;font-weight:800;margin:0}
.empty p{margin:0;color:var(--ink-soft);line-height:1.5;max-width:30ch}

.pick{
  width:100%;border:0;cursor:pointer;border-radius:18px;padding:20px;
  font:800 22px var(--display);letter-spacing:.01em;color:#fff;
  background:linear-gradient(180deg,var(--red-hot),var(--red) 55%,#b80b20);
  box-shadow:0 10px 0 #7d0614, 0 18px 30px -8px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.35) inset;
  transition:transform .08s, box-shadow .08s;
}
.pick:active{transform:translateY(6px);box-shadow:0 4px 0 #7d0614, 0 8px 16px -6px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.35) inset}
.pick small{display:block;font:500 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;opacity:.85;margin-top:4px}
.foot{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:rgba(251,239,230,.65);padding-bottom:6px}
.foot button{background:none;border:0;color:inherit;font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 0}
.confirm{display:flex;gap:10px;align-items:center}
@media (prefers-reduced-motion: reduce){.ticket.deal{animation:none}.pick{transition:none}}
</style>

<div class="app">
  <header>
    <div class="brand"><small>Admit two · tonight</small><h1>TA Film <span>Picker</span></h1></div>

  <div class="seg" id="seg" role="group" aria-label="Mental effort">

  </div>
</div>

const MOODS = [
  {id:"all", label:"Anything", test:()=>true},
  {id:"comedy", label:"Comedy", test:f=>f.g.includes("Comedy")},
  {id:"romance", label:"Romance", test:f=>f.g.includes("Romance")},
  {id:"mystery", label:"Crime & Mystery", test:f=>f.g.some(x=>["Crime","Mystery","Thriller","Film-Noir"].includes(x))},
  {id:"animation", label:"Animation", test:f=>f.g.includes("Animation")},
  {id:"true", label:"True Stories", test:f=>f.g.some(x=>["Biography","Documentary","History"].includes(x))},
  {id:"world", label:"Foreign Language", test:f=>!["USA","UK","Ireland","Canada","Australia","New Zealand"].includes(f.c)},
  {id:"classic", label:"Before 1980", test:f=>f.y<1980},
  {id:"short", label:"Under 2 Hours", test:f=>f.r<120},
];

const store = {
  get(k,d){try{const v=localStorage.getItem("tafp_"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("tafp_"+k,JSON.stringify(v))}catch(e){}}
};
let watched = new Set(store.get("watched",[]));
let mood = store.get("mood","all");
let effort = store.get("effort","any");
if(!["any","easy","brain"].includes(effort)) effort="any";
let recent = store.get("recent",[]);   // last picks, avoids repeats
let current = store.get("current",null);
if(!MOODS.some(m=>m.id===mood)) mood="all";

const $ = id=>document.getElementById(id);
const fmtTime = m=>`${Math.floor(m/60)}h ${String(m%60).padStart(2,"0")}m`;
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const effortOk = f => effort==="any" || (effort==="brain") === (f.m===1);
function pool(){const t=MOODS.find(m=>m.id===mood).test;return FILMS.filter(f=>t(f)&&effortOk(f)&&!watched.has(f.id))}
function renderSeg(){document.querySelectorAll("#seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.e===effort))}

function renderChips(){
  $("chips").innerHTML = MOODS.map(m=>`<button class="chip" type="button" data-id="${m.id}" aria-pressed="${m.id===mood}">${m.label}</button>`).join("");
}
function renderCount(){
  $("count").innerHTML = `<b>${pool().length}</b> to pick from<br>${watched.size} watched`;
}
function renderEmpty(msg){
  $("ticket").innerHTML = `<div class="stub"><span>TA Cinema</span><span class="no">No. 000</span></div>
  <div class="perf"></div>
  <div class="empty"><p class="big">${msg?"All watched":"Tonight's film?"}</p>
  <p>${msg || `${FILMS.length} hand-picked films rated 7.6+ on IMDb. Choose a mood, then tap the red button.`}</p></div>`;
}
function renderFilm(f, animate){
  const t = $("ticket");
  const imdb = "https://www.imdb.com/find/?q="+encodeURIComponent((f.e||f.t)+" "+f.y)+"&s=tt&ttype=ft";
  const isW = watched.has(f.id);
  t.innerHTML = `
    <div class="stub"><span>TA Cinema · ${f.y}</span><span class="no">No. ${String(f.id).padStart(3,"0")}</span></div>
    <div class="perf"></div>
    <div class="main">
      <h2 class="title">${esc(f.t)}</h2>
      ${f.e?`<p class="aka">${esc(f.e)}</p>`:""}
      <dl class="meta">
        <div><dt>Year</dt><dd>${f.y}</dd></div>
        <div><dt>Runtime</dt><dd>${fmtTime(f.r)}</dd></div>
        <div class="rating"><dt>IMDb</dt><dd>${f.s.toFixed(1)}<small>/10</small></dd></div>
      </dl>
      ${f.m
        ? `<div class="effort brain"><b>◆ Brain On</b><span>Needs your full attention. Phones down.</span></div>`
        : `<div class="effort easy"><b>☁ Easy Watch</b><span>Relaxed viewing. Fine with snacks and chatter.</span></div>`}
      <div class="tags">${f.g.map(g=>`<span class="tag">${esc(g)}</span>`).join("")}<span class="tag country">${esc(f.c)}</span></div>
      <p class="summary">${esc(f.d)}</p>
      <div class="actions">
        <button class="btn ${isW?"on":""}" type="button" id="watch">${isW?"✓ Watched":"Mark as watched"}</button>
        <a class="btn" href="${imdb}" target="_blank" rel="noopener">Open on IMDb ↗</a>
      </div>
    </div>`;
  if(animate){t.classList.remove("deal");void t.offsetWidth;t.classList.add("deal")}
  $("watch").onclick=()=>{
    if(watched.has(f.id)) watched.delete(f.id); else watched.add(f.id);
    store.set("watched",[...watched]); renderFilm(f,false); renderCount();
  };
}
function pick(){
  const p = pool();
  if(!p.length){ renderEmpty("You've watched every film that matches these filters. Try another filter or reset your watched list."); return; }
  const fresh = p.filter(f=>!recent.includes(f.id) && f.id!==current);
  const src = fresh.length?fresh:p.filter(f=>f.id!==current);
  const list = src.length?src:p;
  const f = list[Math.floor(Math.random()*list.length)];
  current=f.id; recent=[f.id,...recent].slice(0,Math.min(60,Math.floor(FILMS.length/2)));
  store.set("current",current); store.set("recent",recent);
  renderFilm(f,true);
  if(navigator.vibrate) try{navigator.vibrate(12)}catch(e){}
}

$("chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  mood=b.dataset.id; store.set("mood",mood); renderChips(); renderCount();
});
$("seg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  effort=b.dataset.e; store.set("effort",effort); renderSeg(); renderCount();
});
$("pick").addEventListener("click",pick);
const RESET_HTML = `<button type="button" id="reset">Reset watched</button>`;
$("resetWrap").addEventListener("click",e=>{
  const id=e.target.id;
  if(id==="reset"){
    if(!watched.size) return;
    $("resetWrap").innerHTML=`<span class="confirm">Clear ${watched.size}? <button type="button" id="yes">Yes</button><button type="button" id="no">No</button></span>`;
  }else if(id==="yes"){
    watched=new Set();store.set("watched",[]);$("resetWrap").innerHTML=RESET_HTML;renderCount();
    const f=FILMS.find(x=>x.id===current);f?renderFilm(f,false):renderEmpty();
  }else if(id==="no"){
    $("resetWrap").innerHTML=RESET_HTML;
  }
});

renderSeg(); renderChips(); renderCount();
const last = FILMS.find(x=>x.id===current);
last ? renderFilm(last,false) : renderEmpty();
</script>

</body></html>
